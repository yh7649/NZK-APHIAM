name: gcam_nzk_three_simulated_power_pathways_maximum_coverage_poc_2025_2050
bundle_status: proof_of_concept_assumed_activity_conversions_ranked_factors_and_monitor_centroid_spatial_proxy_not_analytical
years: [2025, 2030, 2035, 2040, 2045, 2050]

inputs:
  power_generation: data/processed/kepco/scenarios/poc_2025_2050/macro_generation_scenarios_2025_2050.csv
  kepco_monthly: data/processed/kepco/kepco_monthly_generation_emissions.csv
  stack_properties: docs/references/crosswalk/stack_properties.csv
  nonpower_projected_emissions: model_inputs/scenarios/team_handoff/aphiam/gcam_kaist/nzk/maximum_coverage_poc_projected_emissions.csv
  nonpower_factor_catalog: data/processed/nonpower_emissions/nonpower_emission_factors.parquet
  nonpower_factor_links: data/processed/nonpower_emissions/nonpower_emission_factor_inventory_links.parquet
  nonpower_spatial_surrogates: model_inputs/scenarios/team_handoff/aphiam/gcam_kaist/nzk/capss_2021_monitor_coordinate_surrogate_weights.parquet

# Hold the native GCAM CORE_9_NZ non-power path fixed and vary only the
# simulated MACRO-shaped power pathway.
scenario_pairs:
  nzk_nonpower_no_nzk_power:
    power: no_nzk
    nonpower: nzk
  nzk_nonpower_low_nzk_power:
    power: nzk_low
    nonpower: nzk
  nzk_nonpower_high_nzk_power:
    power: nzk_high
    nonpower: nzk

power:
  ef_base_year: 2024
  mass_balance_tolerance_mwh: 0.001
  province_crosswalk:
    CNA: Chungcheongnam-do
    CNB: Chungcheongbuk-do
    DJJ: Daejeon
    GGI: Gyeonggi-do
    GNA: Gyeongsangnam-do
    GNB: Gyeongsangbuk-do
    GWN: Gangwon-do
    INC: Incheon
    JEJ: Jeju-do
    JNA: Jeollanam-do
    JNB: Jeonbuk-do
    KWJ: Gwangju
    PUS: Busan
    SEL: Seoul
    SJG: Sejong
    TAE: Daegu
    USN: Ulsan
  technology_crosswalk:
    ThermalPower:
      Coal: conventional_steam_turbine
      NaturalGas: combined_cycle_gas_turbine
      Oil: conventional_steam_turbine
      Biomass: conventional_steam_turbine
    ThermalSteam:
      Coal: cogeneration_chp
      NaturalGas: cogeneration_chp
      Oil: conventional_steam_turbine
      Biomass: cogeneration_chp
    ThermalPowerCCS:
      Coal: conventional_steam_turbine
      NaturalGas: combined_cycle_gas_turbine
  fuel_crosswalk:
    Coal: coal
    NaturalGas: natural_gas
    Oil: oil
    Biomass: biomass
  fuel_compatibility:
    coal: [coal]
    natural_gas: [natural_gas, oil_and_natural_gas]
    oil: [oil, oil_and_natural_gas, bio_oil_and_diesel]
    biomass: [biomass, bio_oil_and_diesel]

nonpower:
  emissions_mode: maximum_coverage_poc
  native_emissions_use: validation_only
  spatialization_mode: capss_monitor_coordinate_proxy

assumptions:
  - All three cases use the same native CORE_9_NZ non-power activity pathway.
  - The power cases use the simulated no_nzk, nzk_low, and nzk_high MACRO-shaped fixtures.
  - Every listed native GCAM activity selector is retained; missing physical conversions use the explicit maximum-coverage POC assumption registry.
  - EF selection uses, in order, denominator-compatible linked candidates, CAPSS base emissions divided by GCAM activity, linked factors with incompatible denominators, and a global pollutant median.
  - Every retained activity receives VOCs, NOx, NH3, SOx, and primary PM2.5 rows, even when the last-resort mapping is suspicious.
  - CAPSS administrative emission shares allocate the national totals; each administrative share is placed at the centroid of real AirKorea monitors in the matching district, matching province, or nation.
  - Monitor centroids are geographic proxies, not actual emitting-source coordinates or population-weighted exposure locations.
  - Candidate factors, assumed conversions, CAPSS-calibrated effective factors, and location proxies are not validated or production-ready.
  - Native GCAM emissions remain a validation table and are not substituted for factor-derived emissions.
  - Every bundle and run sets analytical_use_permitted=false.
