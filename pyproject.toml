[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nzk-aphiam"
version = "0.2.0b1"
description = "Integrated Assessment Model for Air Pollution and Health Impact of Korea's National Decarbonization"
authors = [
  { name = "Yehyun Hong" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "pandas==3.0.3",
    "numpy==2.4.6",
    "loguru==0.7.3",
    "openpyxl==3.1.5",
    "pdfplumber==0.11.8",
    "pyarrow==24.0.0",
    "pyyaml==6.0.3",
    "geopandas==1.1.4",
    "pyshp==3.1.4",
    "scipy==1.17.1",
    "pypdf==6.14.2",
    "scikit-learn==1.9.0",
    "urllib3==2.7.0",
]

[tool.flit.module]
name = "nzk_aphiam"

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["nzk_aphiam"]
force-sort-within-sections = true
